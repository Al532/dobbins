name: Validate and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done < <(git ls-files -z '*.js' '*.mjs')
      - name: Check local HTML links and required reader files
        run: python3 scripts/check-site.py

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Both languages are maintained as HTML. Never overwrite texte.html from texte.md.
      - name: Prepare static site
        run: |
          mkdir _site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='_site/' --exclude='scripts/' --exclude='*.md' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
